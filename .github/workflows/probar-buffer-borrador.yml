name: Probar borrador en Buffer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencia
        run: pip install requests

      - name: Crear borrador de prueba en Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python probar_buffer_borrador.py
