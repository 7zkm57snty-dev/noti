name: Comprobar conexión con Buffer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencia
        run: python -m pip install requests

      - name: Consultar cuenta y canales de Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u comprobar_buffer.py
