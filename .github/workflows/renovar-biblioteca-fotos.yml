name: Renovar biblioteca fotográfica CEV
on:
  schedule:
    - cron: "20 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cev-biblioteca-fotos
  cancel-in-progress: false
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar fotografías reales y verificar licencias
        run: |
          python -m pip install requests
          python renovar_biblioteca_fotos.py
      - name: Guardar biblioteca renovada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca_fotos.json assets/biblioteca-fotos
          if ! git diff --cached --quiet; then
            git commit -m "Renovar biblioteca fotográfica por categorías"
            git push
          else
            echo "La biblioteca no presentó cambios."
          fi
