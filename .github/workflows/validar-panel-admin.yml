name: Validar panel administrativo CEV

on:
  pull_request:
    branches: [main]
    paths:
      - "admin-worker/**"
      - "redactor.py"
      - "periodos_breves.py"
      - "fusionar_cache_borrador.py"
      - "build.py"
      - "feeds.json"
      - ".github/workflows/validar-panel-admin.yml"
      - ".github/workflows/actualizar.yml"
      - ".github/workflows/publicar.yml"
      - "radar_rss.json"
      - "automation_state.json"
  push:
    branches:
      - "feature/panel-admin-cev-2026-11"
    paths:
      - "admin-worker/**"
      - "redactor.py"
      - "fusionar_cache_borrador.py"
      - "build.py"
      - "feeds.json"
      - ".github/workflows/validar-panel-admin.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-worker
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar código Python y catálogo de fuentes
        run: |
          python -m py_compile ../redactor.py ../periodos_breves.py ../build.py ../verificar_publicacion.py ../fusionar_cache_borrador.py
          python -m json.tool ../feeds.json > /dev/null
          python -m json.tool ../radar_rss.json > /dev/null
          python -m json.tool ../automation_state.json > /dev/null
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("../build.py").read_text(encoding="utf-8")
          assert source.count("<style>") == 1 and source.count("</style>") == 1
          css = source.split("<style>", 1)[1].split("</style>", 1)[0]
          required = (
              ".masthead", ".contenedor", ".portada-grid", ".bloque-breves",
              ".tarjeta-vertical", ".tarjeta-cabecera", ".tarjeta-titular",
              ".sello-foto", ".credito-imagen-mini", ".foto-retrato",
              ".articulo", "@media(max-width:900px)",
              "@media(max-width:700px)", "@media(max-width:390px)"
          )
          missing = [selector for selector in required if selector not in css]
          assert not missing, "Faltan reglas del rediseño: " + ", ".join(missing)
          assert 'content="#17212b"' in source, "La barra del navegador móvil no usa el color del encabezado."
          assert "tarjeta-cabecera" in source and "tarjeta-titular" in source
          assert "tarjeta-contenido" in source, "Falta el bloque inferior de resumen de las tarjetas."
          assert "}}\\n.visual-ia" not in source, "Hay un salto de línea literal que puede invalidar el CSS de imágenes."
          print("Correcto: miniaturas y titulares comparten una cabecera; resumen y acciones quedan debajo, con reglas adaptativas.")
          PY
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import sys
          sys.path.insert(0, "..")
          import build

          now = datetime.now(timezone.utc)
          samples = []
          for i in range(3):
              samples.append({
                  "id": f"rss-{i}",
                  "titulo": f"Noticia de prueba número {i} sobre actualidad",
                  "categoria": "Colombia",
                  "fuente": "Medio de prueba",
                  "url": f"https://example.com/noticia-{i}",
                  "fecha": (now - timedelta(minutes=i)).isoformat()
              })
          seleccionados = build.seleccionar_titulares_publicos(samples, [], limite=2)
          completos = build.seleccionar_titulares_publicos(samples, [], limite=None)
          assert len(seleccionados) == 2, f"Se esperaban 2 titulares y llegaron {len(seleccionados)}"
          assert len(completos) == 3, f"Se esperaban 3 titulares sin límite y llegaron {len(completos)}"
          tarjeta = build.tarjeta_rss(seleccionados[0])
          assert "REDACCIÓN CEV NOTICIAS" in tarjeta and "/notas/actualidad-" in tarjeta
          print("Prueba RSS interna correcta: selección y deduplicación.")

          from datetime import datetime
          from zoneinfo import ZoneInfo
          from periodos_breves import obtener_periodo_breves, grupo_en_periodo_breves

          bogota = ZoneInfo("America/Bogota")
          lunes = obtener_periodo_breves(datetime(2026, 11, 2, 6, 0, tzinfo=bogota))
          viernes = obtener_periodo_breves(datetime(2026, 11, 6, 6, 0, tzinfo=bogota))
          assert lunes["clave"] == "lunes-2026-11-02"
          assert lunes["inicio"] == datetime(2026, 10, 30, 6, 0, tzinfo=bogota)
          assert lunes["fin"] == datetime(2026, 11, 2, 6, 0, tzinfo=bogota)
          assert viernes["clave"] == "viernes-2026-11-06"
          assert viernes["inicio"] == datetime(2026, 11, 2, 6, 0, tzinfo=bogota)
          assert viernes["fin"] == datetime(2026, 11, 6, 6, 0, tzinfo=bogota)
          assert obtener_periodo_breves(datetime(2026, 11, 3, 6, 0, tzinfo=bogota)) is None
          assert obtener_periodo_breves(datetime(2026, 11, 6, 5, 59, tzinfo=bogota)) is None
          muestra = {"fuentes": [{"fecha": "2026-11-02T11:00:00+00:00"}]}
          assert grupo_en_periodo_breves(muestra, viernes)
          assert not grupo_en_periodo_breves({"fuentes": [{"fecha": "2026-11-02T10:59:00+00:00"}]}, viernes)
          assert not grupo_en_periodo_breves({"fuentes": [{"fecha": "2026-11-06T11:00:00+00:00"}]}, viernes)
          print("Correcto: ventanas lunes-viernes y viernes-lunes, con límites exactos de las 6:00 a. m.")
          PY
          python - <<'PY'
          import sys
          sys.path.insert(0, "..")
          from fusionar_cache_borrador import merge_cache

          base = {
              "noticias": [
                  {"id": "base", "titulo": "Titular original", "resumen": "Resumen base"}
              ],
              "breves": []
          }
          draft = {
              "noticias": [
                  {"id": "base", "titulo": "Titular corregido", "resumen": "Resumen base"},
                  {"id": "borrador-local", "titulo": "Nueva noticia pendiente"}
              ],
              "breves": []
          }
          current = {
              "noticias": [
                  {"id": "base", "titulo": "Titular original", "resumen": "Resumen editado en main"},
                  {"id": "noticia-remota", "titulo": "Noticia añadida en main"}
              ],
              "breves": []
          }
          added, updated = merge_cache(base, draft, current)
          by_id = {item["id"]: item for item in current["noticias"]}
          assert added == 1 and updated == 1
          assert by_id["borrador-local"]["titulo"] == "Nueva noticia pendiente"
          assert by_id["noticia-remota"]["titulo"] == "Noticia añadida en main"
          assert by_id["base"]["titulo"] == "Titular corregido"
          assert by_id["base"]["resumen"] == "Resumen editado en main"
          print("Correcto: el borrador local conserva sus artículos sin borrar ediciones concurrentes de main.")
          PY

      - name: Validar las cinco notas reales del mini blog
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          sys.path.insert(0, "..")
          import build

          cache = json.loads(Path("../cache.json").read_text(encoding="utf-8"))
          breves = cache.get("breves", [])
          seleccionadas = build.seleccionar_breves_publicos(breves, cache.get("noticias", []))
          assert 1 <= len(seleccionadas) <= 5, (
              f"La edición debe mostrar entre 1 y 5 notas verificadas; quedaron {len(seleccionadas)}."
          )
          for breve in seleccionadas:
              palabras = len(str(breve.get("texto", "")).split())
              assert 45 <= palabras <= 100, f"Extensión incorrecta: {breve.get('titulo')}"
              assert breve.get("ambito") in {"Cali", "Valle del Cauca", "Colombia"}
              tarjeta = build.tarjeta_breve(breve)
              assert breve["titulo"] in tarjeta
              assert "Redacción CEV NOTICIAS" in tarjeta
              for fuente in breve.get("fuentes", []):
                  assert fuente["nombre"] in tarjeta
                  assert fuente["url"] not in tarjeta
                  dominio = urlsplit(fuente["url"]).hostname or ""
                  assert dominio not in tarjeta
              enlaces_imagen = re.findall(r'href="([^"]+)"', tarjeta)
              for enlace in enlaces_imagen:
                  host = urlsplit(enlace).hostname or ""
                  assert host in {"commons.wikimedia.org", "creativecommons.org"}, f"Enlace no permitido en mini-noticia: {enlace}"
          print(f"Correcto: {len(seleccionadas)} notas de la edición pasan filtros y muestran crédito sin enlaces externos.")
          PY

      - name: Probar que el sitio público solo contiene artículos propios
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "..")
          import build

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              build.BASE = root
              build.CACHE = root / "cache.json"
              build.RADAR_RSS = root / "radar_rss.json"
              build.SITE = root / "site"
              build.NOTAS = build.SITE / "notas"
              build.IMAGENES_PROCESADAS = {}
              (root / "cookies.js").write_text("// test", encoding="utf-8")

              parrafo = (
                  "La información disponible permite explicar el hecho, el lugar y su impacto. "
                  "Este párrafo de prueba representa una explicación periodística propia con "
                  "datos verificables, contexto local y una consecuencia concreta para los lectores."
              )
              articulo = {
                  "id": "prueba-cev-original",
                  "autor": "CEV NOTICIAS",
                  "titulo": "CEV NOTICIAS explica un acontecimiento local de prueba",
                  "resumen": "Una cobertura propia de prueba que explica el acontecimiento y su relevancia para Cali.",
                  "categoria": "Cali",
                  "contenido": "\n\n".join([parrafo] * 5),
                  "fecha": "03/11/2026 · 08:00 AM",
                  "fuentes": [{
                      "nombre": "Fuente de prueba",
                      "titulo": "Documento original de prueba",
                      "url": "https://example.com/documento"
                  }],
                  "investigacion": {
                      "enfoque_original": "La cobertura explica el efecto local y diferencia los datos confirmados de los pendientes.",
                      "hechos_clave": [
                          "El acontecimiento ocurrió en Cali.",
                          "La información fue contrastada con un documento enlazado.",
                          "La publicación distingue los hechos confirmados."
                      ]
                  }
              }
              breve = {
                  "id": "breve-propio-prueba",
                  "autor": "Redacción CEV NOTICIAS",
                  "titulo": "Cali prepara medidas para mejorar la movilidad en el centro",
                  "texto": (
                      "La Secretaría de Movilidad anunció una intervención temporal en varios corredores del centro de Cali. "
                      "La medida contempla ajustes de circulación y señalización durante las jornadas de trabajo. "
                      "La entidad señaló que informará los horarios y desvíos antes de iniciar las labores. "
                      "Los conductores deberán consultar las indicaciones instaladas en cada sector y atender las recomendaciones de los agentes."
                  ),
                  "categoria": "Cali",
                  "ambito": "Cali",
                  "estado_informacion": "en_desarrollo",
                  "fecha": datetime.now(timezone.utc).isoformat(),
                  "fuentes": [{
                      "nombre": "Fuente de prueba externa",
                      "titulo": "Reporte original de movilidad",
                      "url": "https://otro-medio.example/noticia"
                  }]
              }
              radar = {
                  "titulares_rss": [{
                      "id": "externa-prueba",
                      "titulo": "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB",
                      "categoria": "Cali",
                      "fuente": "Medio externo",
                      "url": "https://otro-medio.example/noticia",
                      "fecha": datetime.now(timezone.utc).isoformat()
                  }]
              }
              build.CACHE.write_text(json.dumps({"noticias": [articulo], "breves": [breve]}), encoding="utf-8")
              build.RADAR_RSS.write_text(json.dumps(radar), encoding="utf-8")
              build.construir()

              portada = (build.SITE / "index.html").read_text(encoding="utf-8")
              seccion = (build.SITE / "secciones" / "cali.html").read_text(encoding="utf-8")
              pagina_articulo = (build.NOTAS / "prueba-cev-original.html").read_text(encoding="utf-8")
              assert articulo["titulo"] in portada
              assert "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB" not in portada
              assert "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB" not in seccion
              assert not (build.SITE / "actualidad.html").exists()
              assert "Qué aporta esta cobertura" in pagina_articulo
              assert "La cobertura explica el efecto local" in pagina_articulo
              assert "Lo más destacado de la semana" in portada
              assert breve["titulo"] in portada
              assert "Fuente de prueba externa" in portada
              assert "otro-medio.example" not in portada
              assert 'href="https://otro-medio.example' not in portada
              print("Correcto: la portada muestra mini-noticias propias con crédito visible y sin enlaces externos; el radar RSS sigue siendo interno.")
          # Las fotografías editoriales y las mini-noticias deben llevar crédito verificable.
          cache = json.loads(Path("../cache.json").read_text(encoding="utf-8"))
          for item in list(cache.get("noticias", [])) + list(cache.get("breves", [])):
              if item.get("imagen"):
                  credito = item.get("imagen_credito") or {}
                  for campo in ("autor", "fuente", "pagina", "licencia", "tipo"):
                      assert credito.get(campo), f"Falta el crédito {campo} para {item.get('titulo')}"
                  assert credito.get("url") == item["imagen"], f"La URL de crédito no coincide en {item.get('titulo')}"
          print("Correcto: todas las fotos publicadas tienen autor, fuente, página de origen, licencia y tipo de imagen.")

          PY
      - name: Validar sintaxis del verificador de publicación
        run: python -m py_compile ../verificar_publicacion.py
      - name: Instalar Wrangler
        run: npm install

      - name: Validar sintaxis del Worker
        run: node --check src/index.js

      - name: Validar JavaScript de la interfaz
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("src/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Se esperaba un script principal; se encontraron {len(scripts)}")
          Path("/tmp/cev-dashboard.js").write_text(scripts[0], encoding="utf-8")
          print("Script de la interfaz extraído para validar.")
          PY
          node --check /tmp/cev-dashboard.js

      - name: Compilar Worker sin desplegar
        run: npx wrangler deploy --dry-run --outdir=/tmp/cev-admin-dry-run
