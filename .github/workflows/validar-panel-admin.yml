name: Validar panel administrativo CEV

on:
  pull_request:
    branches: [main]
    paths:
      - "admin-worker/**"
      - "redactor.py"
      - "build.py"
      - "feeds.json"
      - ".github/workflows/validar-panel-admin.yml"
      - ".github/workflows/actualizar.yml"
      - ".github/workflows/publicar.yml"
      - "radar_rss.json"
      - "automation_state.json"
  push:
    branches:
      - "feature/panel-admin-cev-2026-11"
    paths:
      - "admin-worker/**"
      - "redactor.py"
      - "build.py"
      - "feeds.json"
      - ".github/workflows/validar-panel-admin.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-worker
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar código Python y catálogo de fuentes
        run: |
          python -m py_compile ../redactor.py ../build.py ../verificar_publicacion.py
          python -m json.tool ../feeds.json > /dev/null
          python -m json.tool ../radar_rss.json > /dev/null
          python -m json.tool ../automation_state.json > /dev/null
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import sys
          sys.path.insert(0, "..")
          import build

          now = datetime.now(timezone.utc)
          samples = []
          for i in range(3):
              samples.append({
                  "id": f"rss-{i}",
                  "titulo": f"Noticia de prueba número {i} sobre actualidad",
                  "categoria": "Colombia",
                  "fuente": "Medio de prueba",
                  "url": f"https://example.com/noticia-{i}",
                  "fecha": (now - timedelta(minutes=i)).isoformat()
              })
          seleccionados = build.seleccionar_titulares_publicos(samples, [], limite=2)
          completos = build.seleccionar_titulares_publicos(samples, [], limite=None)
          assert len(seleccionados) == 2, f"Se esperaban 2 titulares y llegaron {len(seleccionados)}"
          assert len(completos) == 3, f"Se esperaban 3 titulares sin límite y llegaron {len(completos)}"
          tarjeta = build.tarjeta_rss(seleccionados[0])
          assert "REDACCIÓN CEV NOTICIAS" in tarjeta and "/notas/actualidad-" in tarjeta
          print("Prueba RSS interna correcta: selección y deduplicación.")
          PY
      - name: Probar que el sitio público solo contiene artículos propios
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "..")
          import build

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              build.BASE = root
              build.CACHE = root / "cache.json"
              build.RADAR_RSS = root / "radar_rss.json"
              build.SITE = root / "site"
              build.NOTAS = build.SITE / "notas"
              build.IMAGENES_PROCESADAS = {}
              (root / "cookies.js").write_text("// test", encoding="utf-8")

              parrafo = (
                  "La información disponible permite explicar el hecho, el lugar y su impacto. "
                  "Este párrafo de prueba representa una explicación periodística propia con "
                  "datos verificables, contexto local y una consecuencia concreta para los lectores."
              )
              articulo = {
                  "id": "prueba-cev-original",
                  "autor": "CEV NOTICIAS",
                  "titulo": "CEV NOTICIAS explica un acontecimiento local de prueba",
                  "resumen": "Una cobertura propia de prueba que explica el acontecimiento y su relevancia para Cali.",
                  "categoria": "Cali",
                  "contenido": "\n\n".join([parrafo] * 5),
                  "fecha": "03/11/2026 · 08:00 AM",
                  "fuentes": [{
                      "nombre": "Fuente de prueba",
                      "titulo": "Documento original de prueba",
                      "url": "https://example.com/documento"
                  }],
                  "investigacion": {
                      "enfoque_original": "La cobertura explica el efecto local y diferencia los datos confirmados de los pendientes.",
                      "hechos_clave": [
                          "El acontecimiento ocurrió en Cali.",
                          "La información fue contrastada con un documento enlazado.",
                          "La publicación distingue los hechos confirmados."
                      ]
                  }
              }
              breve = {
                  "id": "breve-propio-prueba",
                  "autor": "Redacción CEV NOTICIAS",
                  "titulo": "Cali prepara medidas para mejorar la movilidad en el centro",
                  "texto": (
                      "La Secretaría de Movilidad anunció una intervención temporal en varios corredores del centro de Cali. "
                      "La medida contempla ajustes de circulación y señalización durante las jornadas de trabajo. "
                      "La entidad señaló que informará los horarios y desvíos antes de iniciar las labores. "
                      "Los conductores deberán consultar las indicaciones instaladas en cada sector y atender las recomendaciones de los agentes."
                  ),
                  "categoria": "Cali",
                  "estado_informacion": "en_desarrollo",
                  "fecha": datetime.now(timezone.utc).isoformat(),
                  "fuentes": [{
                      "nombre": "Fuente de prueba externa",
                      "titulo": "Reporte original de movilidad",
                      "url": "https://otro-medio.example/noticia"
                  }]
              }
              radar = {
                  "titulares_rss": [{
                      "id": "externa-prueba",
                      "titulo": "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB",
                      "categoria": "Cali",
                      "fuente": "Medio externo",
                      "url": "https://otro-medio.example/noticia",
                      "fecha": datetime.now(timezone.utc).isoformat()
                  }]
              }
              build.CACHE.write_text(json.dumps({"noticias": [articulo], "breves": [breve]}), encoding="utf-8")
              build.RADAR_RSS.write_text(json.dumps(radar), encoding="utf-8")
              build.construir()

              portada = (build.SITE / "index.html").read_text(encoding="utf-8")
              seccion = (build.SITE / "secciones" / "cali.html").read_text(encoding="utf-8")
              pagina_articulo = (build.NOTAS / "prueba-cev-original.html").read_text(encoding="utf-8")
              assert articulo["titulo"] in portada
              assert "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB" not in portada
              assert "TITULAR EXTERNO QUE NO DEBE APARECER EN LA WEB" not in seccion
              assert not (build.SITE / "actualidad.html").exists()
              assert "Qué aporta esta cobertura" in pagina_articulo
              assert "La cobertura explica el efecto local" in pagina_articulo
              assert "Última hora · Lo más destacado" in portada
              assert breve["titulo"] in portada
              assert "Fuente de prueba externa" in portada
              assert "otro-medio.example" not in portada
              assert 'href="https://otro-medio.example' not in portada
              print("Correcto: la portada muestra mini-noticias propias con crédito visible y sin enlaces externos; el radar RSS sigue siendo interno.")
          PY
      - name: Validar sintaxis del verificador de publicación
        run: python -m py_compile ../verificar_publicacion.py
      - name: Instalar Wrangler
        run: npm install

      - name: Validar sintaxis del Worker
        run: node --check src/index.js

      - name: Validar JavaScript de la interfaz
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("src/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Se esperaba un script principal; se encontraron {len(scripts)}")
          Path("/tmp/cev-dashboard.js").write_text(scripts[0], encoding="utf-8")
          print("Script de la interfaz extraído para validar.")
          PY
          node --check /tmp/cev-dashboard.js

      - name: Compilar Worker sin desplegar
        run: npx wrangler deploy --dry-run --outdir=/tmp/cev-admin-dry-run
