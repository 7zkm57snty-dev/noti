name: Actualizar CEV NOTICIAS

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cev-noticias-publicacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser trafilatura groq pillow

      - name: Generar noticias
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Iniciando redactor de noticias..."
          python -u redactor.py
          echo "Redactor finalizado correctamente."

      - name: Construir página web
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Iniciando construcción de CEV NOTICIAS..."
          python -u build.py
          echo "Página web construida correctamente."

      - name: Guardar historial de noticias sin conflictos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp cache.json /tmp/cev-cache-local.json
          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          def cargar_cache(ruta):
              raw = Path(ruta).read_text(encoding="utf-8").rstrip()
              if raw.endswith("\\n"):
                  raw = raw[:-2]
              return json.loads(raw)
          local = cargar_cache("/tmp/cev-cache-local.json")
          remoto = cargar_cache("cache.json")
          def items(data):
              return data.get("noticias", []) if isinstance(data, dict) else []
          combinadas = {}
          for noticia in items(remoto) + items(local):
              if not isinstance(noticia, dict) or not noticia.get("id"):
                  continue
              ident = str(noticia["id"])
              anterior = combinadas.get(ident, {})
              # Conservar la versión con foto cuando la otra versión está vacía.
              puntuacion = lambda n: (bool(n.get("imagen")), bool(n.get("imagen_instagram")), str(n.get("fecha", "")))
              combinadas[ident] = noticia if puntuacion(noticia) >= puntuacion(anterior) else anterior
          salida = dict(remoto) if isinstance(remoto, dict) else {}
          salida.update({k:v for k,v in local.items() if k not in ("noticias", "solicitudes_groq")})
          salida["noticias"] = sorted(combinadas.values(), key=lambda n: str(n.get("fecha", "")), reverse=True)[:150]
          if local.get("fecha_solicitudes_groq") == remoto.get("fecha_solicitudes_groq"):
              salida["solicitudes_groq"] = max(int(local.get("solicitudes_groq", 0)), int(remoto.get("solicitudes_groq", 0)))
              salida["fecha_solicitudes_groq"] = local.get("fecha_solicitudes_groq")
          else:
              salida["fecha_solicitudes_groq"] = local.get("fecha_solicitudes_groq")
              salida["solicitudes_groq"] = int(local.get("solicitudes_groq", 0))
          Path("cache.json").write_text(json.dumps(salida, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add cache.json
            if git diff --cached --quiet; then
              echo "Historial sin cambios para guardar."
              exit 0
            fi
            git commit -m "Actualizar historial de noticias"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "No se pudo guardar el historial después de 3 intentos."
          exit 1

      - name: Preparar publicación web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar CEV NOTICIAS
        uses: actions/deploy-pages@v4
