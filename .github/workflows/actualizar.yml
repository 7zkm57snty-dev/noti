name: Automatizar y publicar noticias CEV NOTICIAS

on:
  push:
    branches: [main]
    paths:
      - "feeds.json"
      - "redactor.py"
      - "periodos_breves.py"
      - ".github/workflows/actualizar.yml"
  schedule:
    # Rutina de artículos y monitoreo, desplazada para no coincidir con las ediciones de mini-noticias.
    - cron: "5,35 * * * *"
    # 6:00 a. m. en Colombia (UTC-5), lunes y viernes.
    - cron: "0 11 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: cev-contenido-y-radar
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser trafilatura groq pillow

      - name: Comprobar si ya hay una revisión pendiente
        id: estado_cola
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          OPEN_REVIEW_PR="$(gh pr list --state open --base main --json headRefName --jq '[.[] | select((.headRefName | startswith("revision-admin/")) or (.headRefName | startswith("revision-editorial/noticias-pendientes-")))] | length')"
          if [ "${OPEN_REVIEW_PR:-0}" -gt 0 ]; then
            echo "revision_pendiente=true" >> "$GITHUB_OUTPUT"
            echo "Hay una revisión humana pendiente en el panel. La redacción automática se pausa para no duplicar ni sobrescribir propuestas."
            exit 0
          fi
          cp cache.json /tmp/cev-cache-antes.json
          cp automation_state.json /tmp/cev-automation-antes.json
          echo "revision_pendiente=false" >> "$GITHUB_OUTPUT"

      - name: Generar artículos originales
        if: steps.estado_cola.outputs.revision_pendiente != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
          BREVES_PROGRAMADOS: ${{ github.event.schedule == '0 11 * * 1,5' }}
        run: |
          echo "Investigando acontecimientos, contrastando fuentes y preparando artículos originales para revisión editorial humana."
          python -u redactor.py

      - name: Guardar radar RSS y límites diarios independientes
        if: steps.estado_cola.outputs.revision_pendiente != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cache = json.loads(Path("cache.json").read_text(encoding="utf-8"))
          radar = {
              "ultima_actualizacion": cache.get("ultima_actualizacion"),
              "titulares_rss": cache.get("titulares_rss", []),
              "estado_fuentes": cache.get("estado_fuentes", [])
          }
          Path("radar_rss.json").write_text(
              json.dumps(radar, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          state = json.loads(Path("automation_state.json").read_text(encoding="utf-8"))
          print(
              f"Radar RSS: {len(radar['titulares_rss'])} titulares; "
              f"{len(radar['estado_fuentes'])} fuentes comprobadas."
          )
          print(
              f"Tope diario: {state.get('articulos_generados_dia', 0)}/"
              f"{state.get('limite_articulos_diario', 30)} artículos; "
              f"{state.get('solicitudes_groq', 0)}/"
              f"{state.get('limite_solicitudes_diario', 60)} solicitudes."
          )
          PY

          if git diff --quiet -- radar_rss.json automation_state.json; then
            echo "El radar y los contadores no cambiaron."
          else
            cache_draft=false
            if ! git diff --quiet -- cache.json; then
              cp cache.json /tmp/cev-cache-borrador.json
              git restore --worktree -- cache.json
              cache_draft=true
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add radar_rss.json automation_state.json
            git commit -m "Actualizar radar RSS y límites de automatización"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "No fue posible integrar los cambios remotos sin conflicto."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "La rama principal avanzó durante el guardado. Se reintentará ($attempt/3)."
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "No se pudo guardar tras tres intentos." >&2
              exit 1
            fi
            if [ "$cache_draft" = "true" ]; then
              python fusionar_cache_borrador.py --base /tmp/cev-cache-antes.json --draft /tmp/cev-cache-borrador.json --target cache.json
            fi
          fi

      - name: Validar artículos y preparar publicación automática
        id: novedades
        if: steps.estado_cola.outputs.revision_pendiente != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          ruta_cache = Path("cache.json")
          antes = json.loads(Path("/tmp/cev-cache-antes.json").read_text(encoding="utf-8"))
          despues = json.loads(ruta_cache.read_text(encoding="utf-8"))
          ids_antes = {str(n.get("id")) for n in antes.get("noticias", []) if n.get("id")}
          nuevas = [n for n in despues.get("noticias", []) if n.get("id") and str(n["id"]) not in ids_antes]
          validas = []
          invalidas = []

          patron_sensible = re.compile(
              r"\b(accidente|muert[eo]|falleci|homicid|asesinat|robo|hurto|captura|detenid|denuncia|acusaci[oó]n|víctim|victim|agresi[oó]n|desaparici[oó]n|abuso|corrupci[oó]n)\w*",
              re.IGNORECASE
          )

          for noticia in nuevas:
              titulo = str(noticia.get("titulo", "")).strip()
              resumen = str(noticia.get("resumen", "")).strip()
              cuerpo = str(noticia.get("contenido", "")).strip()
              palabras = len(cuerpo.split())
              errores = []

              if not titulo or len(titulo) < 12:
                  errores.append("titular ausente o demasiado corto")
              if not resumen or len(resumen) < 40:
                  errores.append("resumen insuficiente")
              if palabras < 380:
                  errores.append("artículo de menos de 380 palabras")
              parrafos = [p.strip() for p in cuerpo.split("\n\n") if p.strip()]
              if len(parrafos) < 5:
                  errores.append("artículo con menos de cinco párrafos sustanciales")
              investigacion = noticia.get("investigacion") or {}
              if len(str(investigacion.get("enfoque_original", "")).strip()) < 45:
                  errores.append("falta explicar el enfoque o aporte original de CEV")
              hechos_clave = investigacion.get("hechos_clave") or []
              if not isinstance(hechos_clave, list) or len([h for h in hechos_clave if str(h).strip()]) < 3:
                  errores.append("faltan al menos tres hechos clave identificados")
              if noticia.get("categoria") not in {
                  "Cali", "Valle del Cauca", "Colombia",
                  "Deportes", "Tecnología", "Economía", "Tendencias", "Humor y opinión"
              }:
                  errores.append("categoría no reconocida para el enfoque regional y nacional")

              fuentes = []
              dominios = set()
              for fuente in noticia.get("fuentes", []):
                  if not isinstance(fuente, dict):
                      continue
                  url = str(fuente.get("url", "")).strip()
                  partes = urlsplit(url)
                  nombre = str(fuente.get("nombre", "")).strip()
                  titulo_fuente = str(fuente.get("titulo", "")).strip()
                  if partes.scheme == "https" and partes.hostname and nombre and titulo_fuente:
                      fuentes.append(fuente)
                      dominios.add(partes.hostname.lower().removeprefix("www."))

              if not fuentes:
                  errores.append("no hay fuentes directas con HTTPS")
              texto = " ".join((titulo, resumen, cuerpo))
              if patron_sensible.search(texto) and len(dominios) < 2:
                  errores.append("tema sensible sin dos fuentes independientes")

              imagen = str(noticia.get("imagen", "")).strip()
              if imagen:
                  credito = noticia.get("imagen_credito") or {}
                  campos = ("autor", "fuente", "pagina", "licencia", "licencia_url")
                  partes_imagen = urlsplit(imagen)
                  completo = partes_imagen.scheme == "https" and partes_imagen.hostname and all(
                      str(credito.get(campo, "")).strip() for campo in campos
                  )
                  if not completo:
                      noticia["imagen"] = ""
                      noticia["imagen_credito"] = {}
                      print(f"FOTO RETIRADA por falta de atribución/licencia completa: {titulo}")

              if errores:
                  invalidas.append((titulo or "Sin título", errores))
              else:
                  noticia["autor"] = "CEV NOTICIAS"
                  noticia["fuentes"] = fuentes
                  validas.append(noticia)

          if invalidas:
              for titulo, errores in invalidas:
                  print("BORRADOR DESCARTADO:", titulo, "|", "; ".join(errores))

          # Validar mini-noticias. Son textos breves originales, no enlaces ni extractos
          # publicados de otros sitios; el crédito de las fuentes se muestra como texto.
          ids_breves_antes = {
              str(b.get("id")) for b in antes.get("breves", []) or [] if b.get("id")
          }
          breves_anteriores = [
              b for b in (antes.get("breves", []) or [])
              if isinstance(b, dict) and b.get("id")
          ]
          breves_nuevos = [
              b for b in (despues.get("breves", []) or [])
              if isinstance(b, dict) and b.get("id") and str(b["id"]) not in ids_breves_antes
          ]
          breves_validos = []
          breves_invalidos = []
          titulos_breves_vistos = {
              re.sub(r"[^a-z0-9]+", " ", str(b.get("titulo", "")).lower()).strip()
              for b in breves_anteriores
          }
          for breve in breves_nuevos:
              titulo = str(breve.get("titulo", "")).strip()
              texto_breve = str(breve.get("texto", "")).strip()
              palabras = len(texto_breve.split())
              errores = []
              if len(titulo) < 12:
                  errores.append("titular de mini-noticia ausente o demasiado corto")
              if palabras < 45 or palabras > 100:
                  errores.append("mini-noticia fuera del rango de 45 a 100 palabras")
              if breve.get("categoria") not in {
                  "Cali", "Valle del Cauca", "Colombia",
                  "Deportes", "Tecnología", "Economía", "Tendencias", "Humor y opinión"
              }:
                  errores.append("categoría de mini-noticia fuera del enfoque regional y nacional")
              if breve.get("ambito") not in {"Cali", "Valle del Cauca", "Colombia"}:
                  errores.append("mini-noticia sin ámbito geográfico válido: Cali, Valle del Cauca o Colombia")
              clave = re.sub(r"[^a-z0-9]+", " ", titulo.lower()).strip()
              if not clave or clave in titulos_breves_vistos:
                  errores.append("mini-noticia duplicada")
              try:
                  publicado = datetime.fromisoformat(str(breve.get("fecha", "")).replace("Z", "+00:00"))
                  if publicado.tzinfo is None:
                      publicado = publicado.replace(tzinfo=ZoneInfo("UTC"))
                  ahora_local = datetime.now(ZoneInfo("America/Bogota"))
                  publicado_local = publicado.astimezone(ZoneInfo("America/Bogota"))
                  lunes_actual = (ahora_local - __import__("datetime").timedelta(days=ahora_local.weekday())).date()
                  if publicado_local.date() < lunes_actual or publicado_local > ahora_local:
                      errores.append("mini-noticia fuera de la semana actual (lunes a domingo) o con fecha futura")
                  edad_horas = (datetime.now(ZoneInfo("UTC")) - publicado).total_seconds() / 3600
                  if edad_horas > 48 or edad_horas < -2:
                      errores.append("mini-noticia fuera de la ventana de actualidad de 48 horas")
              except (TypeError, ValueError):
                  errores.append("fecha de mini-noticia no verificable")

              fuentes_breve = []
              dominios_breve = set()
              for fuente in breve.get("fuentes", []) or []:
                  if not isinstance(fuente, dict):
                      continue
                  url = str(fuente.get("url", "")).strip()
                  partes = urlsplit(url)
                  nombre = str(fuente.get("nombre", "")).strip()
                  titular_fuente = str(fuente.get("titulo", "")).strip()
                  if partes.scheme == "https" and partes.hostname and nombre and titular_fuente:
                      fuentes_breve.append(fuente)
                      dominios_breve.add(partes.hostname.lower().removeprefix("www."))
              if not fuentes_breve:
                  errores.append("mini-noticia sin fuentes directas identificables")
              texto_completo_breve = " ".join((titulo, texto_breve))
              if patron_sensible.search(texto_completo_breve) and len(dominios_breve) < 2:
                  errores.append("tema sensible sin dos fuentes independientes")
              fuentes_primarias = (
                  "gov.co", ".gov", ".gob.es", ".gov.uk",
                  "cali.gov.co", "valledelcauca.gov.co", "emcali.com.co",
                  "policia.gov.co", "fiscalia.gov.co", "dane.gov.co",
                  "minsalud.gov.co", "mintransporte.gov.co"
              )
              hay_primaria = any(
                  any((urlsplit(f["url"]).hostname or "").lower().removeprefix("www.").endswith(d) for d in fuentes_primarias)
                  for f in fuentes_breve
              )
              if len(dominios_breve) < 2 and not hay_primaria:
                  errores.append("mini-noticia necesita dos dominios o una fuente primaria oficial")
              if errores:
                  breves_invalidos.append((titulo or "Sin título", errores))
              else:
                  breve["autor"] = "Redacción CEV NOTICIAS"
                  breve["fuentes"] = fuentes_breve
                  breves_validos.append(breve)
                  titulos_breves_vistos.add(clave)

          if breves_invalidos:
              for titulo, errores in breves_invalidos:
                  print("MINI-NOTICIA DESCARTADA:", titulo, "|", "; ".join(errores))

          # Resumen que acompañará la propuesta en la cola de revisión humana.
          lineas = [
              "## Lote editorial CEV NOTICIAS",
              "",
              "Los artículos completos y las mini-noticias de este lote fueron redactados a partir de investigación documental. Nada se publica hasta que una persona revise y apruebe el lote desde el panel privado.",
              "",
              f"**Artículos completos válidos:** {len(validas)}",
              f"**Mini-noticias válidas:** {len(breves_validos)}",
              ""
          ]
          for noticia in validas:
              investigacion = noticia.get("investigacion") or {}
              lineas.extend([
                  f"### {noticia.get('titulo', 'Sin título')}",
                  f"- **Sección:** {noticia.get('categoria', 'Sin sección')}",
                  f"- **Extensión:** {len(str(noticia.get('contenido', '')).split())} palabras",
                  f"- **Fuentes recuperadas:** {investigacion.get('fuentes_recuperadas', len(noticia.get('fuentes', [])))}",
                  f"- **Enfoque CEV:** {investigacion.get('enfoque_original', 'No indicado')}",
                  "- **Fuentes consultadas:** " + ", ".join(
                      str(x.get("nombre", "Fuente")) for x in noticia.get("fuentes", [])
                  ),
                  ""
              ])
          for breve in breves_validos:
              lineas.extend([
                  f"### MINI-NOTICIA · {breve.get('titulo', 'Sin título')}",
                  f"- **Ámbito geográfico:** {breve.get('ambito', 'Sin ámbito')}",
                  f"- **Sección:** {breve.get('categoria', 'Sin sección')}",
                  f"- **Extensión:** {len(str(breve.get('texto', '')).split())} palabras",
                  f"- **Estado:** {breve.get('estado_informacion', 'información preliminar')}",
                  f"- **Texto:** {breve.get('texto', '')}",
                  "- **Crédito de fuentes:** " + ", ".join(
                      str(x.get("nombre", "Fuente")) for x in breve.get("fuentes", [])
                  ),
                  ""
              ])
          Path("/tmp/cev_revision_body.md").write_text("\n".join(lineas), encoding="utf-8")

          ids_validas = {str(n.get("id")) for n in validas}
          ids_permitidos = ids_antes | ids_validas
          despues["noticias"] = [
              n for n in despues.get("noticias", [])
              if n.get("id") and str(n["id"]) in ids_permitidos
          ]
          ids_breves_validos = ids_breves_antes | {str(b.get("id")) for b in breves_validos}
          despues["breves"] = [
              b for b in (despues.get("breves", []) or [])
              if b.get("id") and str(b["id"]) in ids_breves_validos
          ][:50]

          # El cupo diario cuenta solo los artículos y mini-noticias que superan las validaciones.
          estado_path = Path("automation_state.json")
          estado_actual = json.loads(estado_path.read_text(encoding="utf-8"))
          estado_antes = json.loads(Path("/tmp/cev-automation-antes.json").read_text(encoding="utf-8"))
          hoy = datetime.now(ZoneInfo("America/Bogota")).date().isoformat()
          base_hoy = (
              int(estado_antes.get("articulos_generados_dia", 0))
              if estado_antes.get("fecha_articulos_dia") == hoy else 0
          )
          estado_actual["fecha_articulos_dia"] = hoy
          estado_actual["articulos_generados_dia"] = base_hoy + len(validas)
          base_breves_hoy = (
              int(estado_antes.get("breves_generados_dia", 0))
              if estado_antes.get("fecha_breves_dia") == hoy else 0
          )
          estado_actual["fecha_breves_dia"] = hoy
          estado_actual["breves_generados_dia"] = base_breves_hoy + len(breves_validos)
          estado_actual["limite_breves_diario"] = int(estado_actual.get("limite_breves_diario", 30))
          estado_path.write_text(
              json.dumps(estado_actual, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(
              f"Cupo diario conciliado: {estado_actual['articulos_generados_dia']}/"
              f"{estado_actual.get('limite_articulos_diario', 20)} artículos válidos."
          )

          if not validas and not breves_validos:
              ruta_cache.write_text(
                  json.dumps(antes, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("No quedaron artículos o mini-noticias aptos para revisión editorial. Se conserva intacto el archivo editorial.")
              Path(os.environ["GITHUB_OUTPUT"]).write_text("hay_novedades=false\n", encoding="utf-8")
          else:
              ruta_cache.write_text(
                  json.dumps(despues, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print(f"Artículos completos aptos: {len(validas)}")
              print(f"Mini-noticias rápidas aptas: {len(breves_validos)}")
              for noticia in validas:
                  print(f"ARTÍCULO · {noticia.get('categoria')}: {noticia.get('titulo')}")
              for breve in breves_validos:
                  print(f"BREVE · {breve.get('categoria')}: {breve.get('titulo')}")
              Path(os.environ["GITHUB_OUTPUT"]).write_text("hay_novedades=true\n", encoding="utf-8")
          PY

      - name: Persistir límites diarios cuando no hay artículos para proponer
        if: steps.estado_cola.outputs.revision_pendiente != 'true' && steps.novedades.outputs.hay_novedades != 'true'
        shell: bash
        run: |
          git add automation_state.json
          if git diff --cached --quiet; then
            echo "Los límites diarios ya están actualizados."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar consumo diario de automatización"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "No fue posible integrar los cambios remotos sin conflicto."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "La rama principal avanzó durante el guardado. Se reintentará ($attempt/3)."
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "No se pudo guardar tras tres intentos." >&2
              exit 1
            fi
          fi

      - name: Persistir límites diarios antes de solicitar aprobación editorial
        if: steps.estado_cola.outputs.revision_pendiente != 'true' && steps.novedades.outputs.hay_novedades == 'true'
        shell: bash
        run: |
          git add automation_state.json
          if git diff --cached --quiet; then
            echo "Los límites diarios ya están guardados."
          else
            cache_draft=false
            if ! git diff --quiet -- cache.json; then
              cp cache.json /tmp/cev-cache-borrador.json
              git restore --worktree -- cache.json
              cache_draft=true
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar consumo de investigación editorial"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "No fue posible integrar los cambios remotos sin conflicto."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "La rama principal avanzó durante el guardado. Se reintentará ($attempt/3)."
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "No se pudo guardar tras tres intentos." >&2
              exit 1
            fi
            if [ "$cache_draft" = "true" ]; then
              python fusionar_cache_borrador.py --base /tmp/cev-cache-antes.json --draft /tmp/cev-cache-borrador.json --target cache.json
            fi
          fi

      - name: Enviar artículos completos a revisión editorial humana
        if: steps.estado_cola.outputs.revision_pendiente != 'true' && steps.novedades.outputs.hay_novedades == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          BRANCH="revision-editorial/noticias-pendientes-${RUN_ID}"
          git checkout -b "$BRANCH"
          git add cache.json
          git commit -m "Preparar propuestas de investigación CEV NOTICIAS"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "CEV NOTICIAS | Artículos y mini-noticias para revisión editorial" \
            --body-file /tmp/cev_revision_body.md
          echo "Propuestas preparadas; no se publican hasta su aprobación desde el panel editorial."
