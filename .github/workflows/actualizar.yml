name: Actualizar CEV NOTICIAS

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cev-noticias-publicacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser trafilatura groq pillow

      - name: Generar noticias
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Iniciando redactor de noticias..."
          python -u redactor.py
          echo "Redactor finalizado correctamente."

      - name: Construir página web
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Iniciando construcción de CEV NOTICIAS..."
          python -u build.py
          echo "Página web construida correctamente."

      - name: Guardar historial de noticias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de noticias"
            git push
          else
            echo "No hay cambios en el historial."
          fi

      - name: Preparar publicación web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar CEV NOTICIAS
        uses: actions/deploy-pages@v4

      - name: Añadir noticias verificadas a la cola automática de Instagram
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u publicar_buffer.py

      - name: Guardar control de publicaciones para evitar duplicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buffer_publicados.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar publicaciones enviadas a Buffer"
            git push
          else
            echo "No hay nuevos registros de Buffer."
          fi
