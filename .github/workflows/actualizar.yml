
name: Actualizar CEV NOTICIAS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cev-noticias-publicacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser trafilatura google-genai

      - name: Generar noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python redactor.py
          python build.py

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar CEV NOTICIAS
        uses: actions/deploy-pages@v4
