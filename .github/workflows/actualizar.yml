name: Preparar noticias para revisión editorial

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cev-noticias-revision-editorial
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser trafilatura groq pillow

      - name: Recuperar borradores de una revisión abierta
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          BRANCH="revision-editorial/noticias-pendientes"
          OPEN_PR="$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')"
          if [ "\${OPEN_PR:-0}" -gt 0 ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:cache.json" > cache.json
            echo "Se recuperó la cola que ya está pendiente de revisión."
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH"
            echo "Se limpió una rama anterior que ya no tiene una revisión abierta."
          fi
          cp cache.json /tmp/cev-cache-antes.json

      - name: Generar borradores
        env:
          GROQ_API_KEY: \${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Preparando noticias; todavía no se publican."
          python -u redactor.py

      - name: Evitar propuestas sin noticias nuevas
        id: novedades
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          antes = json.loads(Path("/tmp/cev-cache-antes.json").read_text(encoding="utf-8"))
          despues = json.loads(Path("cache.json").read_text(encoding="utf-8"))
          ids_antes = {str(n.get("id")) for n in antes.get("noticias", []) if n.get("id")}
          nuevas = [n for n in despues.get("noticias", []) if n.get("id") and str(n["id"]) not in ids_antes]

          if not nuevas:
              Path("cache.json").write_text(
                  json.dumps(antes, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print("No hay artículos nuevos. No se actualizará la propuesta editorial.")
              Path(os.environ["GITHUB_OUTPUT"]).write_text("hay_novedades=false\n", encoding="utf-8")
          else:
              print(f"Artículos nuevos para revisión humana: {len(nuevas)}")
              for noticia in nuevas:
                  print(f"- {noticia.get('categoria')}: {noticia.get('titulo')}")
              Path(os.environ["GITHUB_OUTPUT"]).write_text("hay_novedades=true\n", encoding="utf-8")
          PY

      - name: Abrir o actualizar propuesta editorial
        if: steps.novedades.outputs.hay_novedades == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            cache.json
          branch: revision-editorial/noticias-pendientes
          base: main
          delete-branch: true
          commit-message: "Proponer noticias para revisión editorial"
          title: "CEV NOTICIAS | Revisión editorial de nuevas noticias"
          body: |
            La automatización preparó nuevos borradores. **No se publicarán en CEV NOTICIAS hasta que esta propuesta sea revisada y fusionada.**

            ### Revisión humana mínima antes de publicar
            - [ ] El titular y el resumen representan fielmente el artículo, sin exagerar los hechos.
            - [ ] Se abrieron las fuentes y se comprobaron nombres, fechas, cifras y lugares.
            - [ ] Accidentes, delitos, víctimas, acusaciones y controversias sensibles tienen corroboración de fuentes independientes; si no, retirar o corregir el artículo antes de fusionar.
            - [ ] Toda fotografía es pertinente y conserva crédito, página de origen y licencia; si no hay foto válida, la noticia queda sin imagen.
            - [ ] No hay duplicados ni datos personales innecesarios.

            **Al fusionar esta propuesta, autorizas la publicación del lote completo.** Si algún artículo no cumple, edita cache.json en esta propuesta antes de fusionar.
          draft: false
