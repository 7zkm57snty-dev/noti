name: Actualizar CEV NOTICIAS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar noticias y generar el sitio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build.py
      - name: Mantener activo el repositorio
        run: |
          date -u +%F > ultima_actualizacion.txt
          git config user.name "cev-bot"
          git config user.email "cev-bot@users.noreply.github.com"
          git add ultima_actualizacion.txt
          if [ -f cache.json ]; then git add cache.json; fi
          git commit -m "Actualización diaria" || true
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
