name: Publicar CEV NOTICIAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cev-noticias-publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construir el sitio
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u build.py

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar CEV NOTICIAS
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar que el dominio público refleja la versión desplegada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
          VERIFY_ATTEMPTS: "55"
          VERIFY_RETRY_SECONDS: "10"
        run: python -u verificar_publicacion.py
