name: Actualizar radar RSS CEV NOTICIAS

on:
  schedule:
    # Independiente de la cola editorial: se actualiza cada 20 minutos.
    - cron: "10,30,50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.json"
      - "actualizar_radar_rss.py"
      - ".github/workflows/radar-rss.yml"

permissions:
  contents: write

concurrency:
  group: cev-radar-rss
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias RSS
        run: python -m pip install requests feedparser
      - name: Validar catálogo de fuentes
        run: python -m json.tool feeds.json > /dev/null
      - name: Consultar fuentes y actualizar titulares
        run: python -u actualizar_radar_rss.py
      - name: Publicar actualización del radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_rss.json
          if git diff --cached --quiet; then
            echo "El radar no cambió."
            exit 0
          fi
          git commit -m "Actualizar radar RSS automáticamente"
          git push origin HEAD:main
